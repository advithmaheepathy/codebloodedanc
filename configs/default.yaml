# =============================================================================
# Single-microphone noise suppression for defence communications
# SIH problem statement 26052
#
# Delivered pipeline:
#     capture -> preprocess -> DeepFilterNet3 -> volume normalisation -> output
#
# Override anything on the command line:
#   anc <command> --set normalise.target_dbfs=-23 --set neural.num_threads=1
# or layer configs:
#   anc <command> -c configs/default.yaml -c configs/jetson.yaml
#
# The fully resolved configuration is printed at startup and saved into the
# session directory as config.yaml.
# =============================================================================

run:
  seed: 1234
  session_root: sessions
  name: null
  log_level: INFO
  deterministic_torch: true

# -----------------------------------------------------------------------------
# Signal geometry. Fixed by DeepFilterNet3: 48 kHz, 20 ms window, 10 ms hop.
# The supplied corpus is 16 kHz and is upsampled to 48 kHz on load.
# -----------------------------------------------------------------------------
audio:
  sample_rate: 48000
  hop_size: 480                   # 10 ms
  fft_size: 960                   # 20 ms

# -----------------------------------------------------------------------------
# Pre-processing.
# -----------------------------------------------------------------------------
preprocess:
  dc_removal: true
  dc_cutoff_hz: 5.0
  highpass:
    enabled: true
    cutoff_hz: 80.0               # removes rumble and handling noise below speech
    order: 2
  guard_nonfinite: true           # zero NaN/Inf frames, count them, log once
  denormal_floor: 1.0e-20
  reference_gain_db: 0.0

# -----------------------------------------------------------------------------
# Voice activity detection. Drives the volume normaliser's pause hold.
# -----------------------------------------------------------------------------
vad:
  enabled: true
  method: energy_flatness
  frame_ms: 10.0
  energy_margin_db: 8.0
  flatness_threshold: 0.45
  noise_floor_smoothing: 0.995
  hangover_ms: 300.0
  min_speech_ms: 30.0

# -----------------------------------------------------------------------------
# Neural stage: pretrained DeepFilterNet3, unmodified. Nothing is trained here.
# -----------------------------------------------------------------------------
neural:
  enabled: true
  model: DeepFilterNet3
  model_base_dir: null            # null uses the packaged pretrained weights
  backend: torch
  device: cpu                     # auto | cpu | cuda
  num_threads: null               # set to 1 for the single-thread portability figure
  # Cap on suppression depth. Set from measurement on 72 balanced examples: limiting
  # attenuation stops the model damaging speech where there is little noise to remove.
  #   none -> PESQ 2.090  STOI 0.851  speech atten 3.97 dB  (PESQ 2.874 at +15 dB in)
  #   30   -> PESQ 2.100  STOI 0.856  speech atten 3.71 dB  (PESQ 3.032 at +15 dB in)
  #   24   -> PESQ 2.045  STOI 0.853  speech atten 3.54 dB
  atten_lim_db: 30.0
  post_filter: false
  warmup_frames: 10
  streaming:
    mode: chunked                 # chunked (safe) | per_hop (not implemented)
    chunk_s: 1.5
    overlap: 0.5
    crossfade_ms: 30.0
    offline_framing: whole_file   # whole_file = reference inference path for offline runs

# -----------------------------------------------------------------------------
# Volume normalisation: the second and final stage.
#
# agc  speech-aware automatic gain control. Tracks the active speech level, moves
#      the gain smoothly toward the target, and HOLDS the gain during pauses so
#      residual noise is not pumped up. Look-ahead soft limiter prevents clipping.
# peak one static gain so the peak lands on the ceiling
# rms  one static gain so the active speech level hits the target
# off  pass through
# -----------------------------------------------------------------------------
normalise:
  mode: agc
  target_dbfs: -26.0              # ITU-T P.56 convention for speech level
  min_gain_db: -12.0
  max_gain_db: 24.0
  attack_ms: 150.0                # gain rise time constant
  release_ms: 600.0               # gain fall time constant
  level_attack_ms: 50.0
  level_release_ms: 800.0
  hold_during_pause: true         # the setting that stops the AGC pumping noise
  gate_dbfs: -60.0
  limiter_ceiling_dbfs: -1.0
  limiter_lookahead_ms: 5.0       # the only latency added after the model
  limiter_release_ms: 120.0

# -----------------------------------------------------------------------------
# Stage orchestration.
#   dfn_then_normalise  the delivered pipeline
#   dfn_only            model alone, for the ablation
#   normalise_only      normalisation alone, for the ablation
#   passthrough         no processing
#   nlms_* / *_nlms     rejected two-microphone designs, retained only so they can
#                       be measured and reported. See README.md.
# -----------------------------------------------------------------------------
pipeline:
  order: dfn_then_normalise

# -----------------------------------------------------------------------------
# NLMS settings. Not part of the delivered pipeline; used only when one of the
# rejected orders is evaluated for the record.
# -----------------------------------------------------------------------------
nlms:
  enabled: true
  impl: fdaf
  filter_length: 7680             # 160 ms @ 48 kHz
  mu: 0.1
  eps: 1.0e-6
  leakage: 0.0
  power_smoothing: 0.9
  double_talk:
    mode: freeze
    mu_scale: 0.05
  impulse_guard:
    mode: clip
    crest_factor_db: 12.0
    update_clip_sigma: 4.0
  safeguards:
    reference_silence_dbfs: -65.0
    divergence_margin_db: 6.0
    weight_norm_limit: 10000.0
    rollback: true
    checkpoint_interval_frames: 25

# -----------------------------------------------------------------------------
# Metrics.
# -----------------------------------------------------------------------------
metrics:
  pesq: true                      # wideband PESQ, computed at 16 kHz
  stoi: true
  estoi: true
  sisdr: true
  segsnr: true
  lsd: true
  snr: true
  erle: true
  events: true                    # per-event impulsive suppression and dropout check
  dnsmos: false                   # needs onnxruntime plus the official ONNX model
  pesq_mode: wb
  segsnr_frame_ms: 20.0
  level_align: true               # required: the pipeline ends with a gain stage
  snr_buckets:
    - [-12.5, -7.5]
    - [-7.5, -2.5]
    - [-2.5, 2.5]
    - [2.5, 7.5]
    - [7.5, 12.5]
    - [12.5, 17.5]
  headline_snr_range: [-10.0, 15.0]   # the corpus's full SNR range

# -----------------------------------------------------------------------------
# The supplied single-channel corpus.
#
# 5000 labelled examples: gunshot 4385, airplane 135, helicopter 134, engine 125,
# siren 113, train 108, at SNRs -10/-5/0/5/10/15 dB. Because gunshot is 88% of the
# corpus, the evaluation uses a category x SNR balanced subset so that "overall"
# numbers are not simply gunshot numbers, and every table breaks out per category.
# -----------------------------------------------------------------------------
plain:
  root: dataset_plain
  metadata: dataset_plain/metadata.csv
  native_sample_rate: 16000
  per_cell: 6                     # examples per (category, SNR) cell -> 6*36 = 216
  categories: null                # null = all six
  snr_values: null                # null = all six
  max_duration_s: 12.0            # long files are cropped so one outlier cannot dominate

# -----------------------------------------------------------------------------
# Reporting. Targets are the mandated figures from the problem statement.
# -----------------------------------------------------------------------------
report:
  write_pdf: true
  write_json: true
  write_csv: true
  write_wav: true
  spectrograms: true
  targets:
    snr_improvement_db: 15.0
    stoi: 0.85
    pesq: 2.5
  dpi: 110

# -----------------------------------------------------------------------------
# Offline inputs.
# -----------------------------------------------------------------------------
offline:
  primary: null                   # single-file mode: the noisy WAV
  reference: null                  # only used by the rejected adaptive designs
  clean: null                     # clean target; enables PESQ/STOI/SI-SDR
  manifest: null                  # a generated manifest, instead of the plain corpus
  limit: null
  workers: 0                      # 0 = pick from the core count, 1 = serial

# -----------------------------------------------------------------------------
# Live single-microphone mode.
# -----------------------------------------------------------------------------
live:
  duration_s: 30.0
  input_device: null              # index or name substring; null = system default
  output_device: null
  monitor: true
  monitor_gain_db: -6.0           # USE HEADPHONES: speaker monitoring will howl
  blocksize: 480
  ring_capacity_s: 8.0
  noise_file: null
  noise_snr_db: 0.0
  noise_rir: true
  calibration_s: 2.0
  save_streams: true

# -----------------------------------------------------------------------------
# Synthetic dataset generator. Superseded by the supplied corpus; retained so the
# repository can generate its own evaluation data when none is provided.
# -----------------------------------------------------------------------------
dataset:
  out_dir: data/eval
  clean_dir: data/raw/speech
  noise_dir: data/raw/noise
  seed: 4242
  total_minutes: 10.0
  utterance_s: 8.0
  snr_db_min: -5.0
  snr_db_max: 20.0
  n_noise_sources_max: 2
  write_wav: true
  write_hdf5: false
  subsets: [main, impulsive, low_snr]
  rir:
    enabled: true
    source: simulated
    room_dim_min: [3.0, 3.0, 2.4]
    room_dim_max: [8.0, 7.0, 3.2]
    rt60_min_s: 0.15
    rt60_max_s: 0.35
    max_order: 10
    n_rirs: 12
    truncate_db: -40.0
    speech_rir: false
  impulsive:
    events_per_minute_min: 4.0
    events_per_minute_max: 20.0
    peak_level_dbfs_min: -18.0
    peak_level_dbfs_max: -3.0
    preserve_crest_factor: true
    min_gap_s: 0.25
  augment:
    clipping_prob: 0.25
    clipping_threshold_min: 0.5
    clipping_threshold_max: 0.95
    level_prob: 0.5
    level_range_db: [-12.0, 0.0]
    spectral_tilt_prob: 0.25
    spectral_tilt_db_per_khz: [-1.0, 1.0]
    mic_self_noise_dbfs: -70.0
